packages:
  - "apps/*"
  - "packages/*"
  - "others/userscripts/*"

nodeVersion: 22.22.2
engineStrict: true
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

overrides:
  "@esbuild-kit/core-utils>esbuild": 0.25.4
  brace-expansion: 5.0.8
  kysely: 0.28.17
  postcss: 8.5.18
  sharp: 0.35.0
  use-sync-external-store: 1.4.0

allowBuilds:
  "@react-spring/core": true
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  sharp: true

ignoredBuiltDependencies:
  - unrs-resolver

# Keep minimatch 3 and 9 compatible with the patched brace-expansion API.
patchedDependencies:
  brace-expansion@5.0.8: patches/brace-expansion@5.0.8.patch
