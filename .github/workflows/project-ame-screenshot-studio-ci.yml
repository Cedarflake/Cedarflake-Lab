name: "[Project] Ame Screenshot Studio CI"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/ame-screenshot-studio/**"
      - ".github/workflows/project-ame-screenshot-studio-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/ame-screenshot-studio/**"
      - ".github/workflows/project-ame-screenshot-studio-ci.yml"

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: apps/ame-screenshot-studio

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: apps/ame-screenshot-studio/tools/test_prepare_library.py

      - name: Build and test native capture helper
        run: ./capture/build.ps1 -TestGeometry -TestIdentity

      - name: Test offline library preparation
        run: uv run --no-project --script tools/test_prepare_library.py
