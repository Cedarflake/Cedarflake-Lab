name: "[Project] YouTube Auto Resume Extension CI"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/youtube-auto-resume-extension/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "patches/**"
      - "scripts/auditDependencies*.mjs"
      - "scripts/checkBracesSecurity.cjs"
      - ".github/workflows/project-youtube-auto-resume-extension-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/youtube-auto-resume-extension/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "patches/**"
      - "scripts/auditDependencies*.mjs"
      - "scripts/checkBracesSecurity.cjs"
      - ".github/workflows/project-youtube-auto-resume-extension-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check extension
        run: pnpm --filter @cedarflake/youtube-auto-resume-extension --fail-if-no-match check

      - name: Build extension
        run: pnpm --filter @cedarflake/youtube-auto-resume-extension --fail-if-no-match build

      - name: Install Playwright browser
        run: pnpm --dir apps/youtube-auto-resume-extension exec playwright install --with-deps chromium

      - name: Test extension runtime
        run: pnpm --filter @cedarflake/youtube-auto-resume-extension --fail-if-no-match test:e2e

      - name: Audit workspace dependencies
        if: ${{ !cancelled() }}
        run: |
          pnpm test:dependency-audit
          pnpm audit:dependencies
