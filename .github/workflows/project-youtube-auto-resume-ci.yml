name: "[Project] YouTube Auto Resume CI"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "others/userscripts/youtube-auto-resume/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "patches/**"
      - "scripts/auditDependencies*.mjs"
      - "scripts/checkBracesSecurity.cjs"
      - ".github/workflows/project-youtube-auto-resume-ci.yml"
  push:
    branches:
      - main
    paths:
      - "others/userscripts/youtube-auto-resume/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "patches/**"
      - "scripts/auditDependencies*.mjs"
      - "scripts/checkBracesSecurity.cjs"
      - ".github/workflows/project-youtube-auto-resume-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check userscript version
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: pnpm --filter @cedarflake/youtube-auto-resume --fail-if-no-match version:check --base-ref="$BASE_REF"

      - name: Check userscript version on push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BASE_REF: ${{ github.event.before }}
        run: pnpm --filter @cedarflake/youtube-auto-resume --fail-if-no-match version:check --base-ref="$BASE_REF"

      - name: Install Playwright browser
        run: pnpm --dir others/userscripts/youtube-auto-resume exec playwright install --with-deps chromium

      - name: Check YouTube userscript
        run: pnpm --filter @cedarflake/youtube-auto-resume --fail-if-no-match check

      - name: Audit workspace dependencies
        if: ${{ !cancelled() }}
        run: |
          pnpm test:dependency-audit
          pnpm audit:dependencies
